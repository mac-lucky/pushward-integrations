name: Shared Module Tests

# The per-bridge workflows run go test rooted at their own module, so nothing
# ever executed the shared module's suite; this fills that gap.

on:
  push:
    branches: [main]
    paths: ['shared/**', '.github/workflows/shared-tests.yml']
  pull_request:
    branches: [main]
    paths: ['shared/**', '.github/workflows/shared-tests.yml']

permissions:
  contents: read

jobs:
  test:
    name: Test shared module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: shared/go.mod
          cache-dependency-path: shared/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...
