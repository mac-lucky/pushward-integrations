name: Release

on:
  push:
    tags:
      - 'backrest/v*'
      - 'bambulab/v*'
      - 'forgejo/v*'
      - 'github/v*'
      - 'grafana/v*'
      - 'relay/v*'
      - 'sabnzbd/v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

jobs:
  parse:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      bridge: ${{ steps.x.outputs.bridge }}
      version: ${{ steps.x.outputs.version }}
    steps:
      - id: x
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          BRIDGE="${REF%%/*}"
          VERSION="${REF##*/}"
          VERSION="${VERSION#v}"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed bridge=$BRIDGE version=$VERSION"

  backrest:
    needs: parse
    if: needs.parse.outputs.bridge == 'backrest'
    uses: mac-lucky/actions-shared-workflows/.github/workflows/go-cicd-reusable.yml@master
    with:
      app_name: "pushward-backrest"
      ghcr_image: "ghcr.io/mac-lucky/pushward-backrest"
      dockerhub_image: "maclucky/pushward-backrest"
      push_to_dockerhub: false
      main_branch: "main"
      build_context: "."
      dockerfile_path: "./backrest/Dockerfile"
      go_module_path: "./backrest"
      enable_go_tests: true
      go_test_args: "-race -count=1 -v"
      enable_container_tests: false
      enable_kubernetes_tests: false
      release_notes_path_filter: "./backrest ./shared"
    secrets: inherit

  bambulab:
