name: CI/CD Backrest

on:
  push:
    branches: [main]
    paths: ['backrest/**', 'shared/**', '.github/workflows/backrest-ci-cd.yml']
  pull_request:
    branches: [main]
    paths: ['backrest/**', 'shared/**', '.github/workflows/backrest-ci-cd.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-cd:
    uses: mac-lucky/actions-shared-workflows/.github/workflows/go-cicd-reusable.yml@master
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    with:
      app_name: "pushward-backrest"
      ghcr_image: "ghcr.io/mac-lucky/pushward-backrest"
      dockerhub_image: "maclucky/pushward-backrest"
      push_to_dockerhub: false
      push_on_main: true
      enable_auto_version: false
      enable_main_dev_tag: true
      main_branch: "main"
      build_context: "."
      dockerfile_path: "./backrest/Dockerfile"
      go_module_path: "./backrest"
      enable_go_tests: true
      go_test_args: "-race -count=1 -v"
      enable_container_tests: false
      enable_kubernetes_tests: false
    secrets: inherit
