# pushward-grafana configuration
# Runs as a sidecar next to Grafana, receives alert webhooks,
# queries Prometheus/VictoriaMetrics for metric history,
# and pushes timeline sparklines to PushWard Live Activities.

# Optional: Shared secret for authenticating Grafana webhook requests.
# Can also be set via PUSHWARD_WEBHOOK_TOKEN env var.
# Configure the matching token in your Grafana contact point under
# Authorization: Bearer <token>.
# webhook_token: ""

server:
  address: ":8090"

# PushWard API connection
pushward:
  url: "https://api.pushward.app"
  api_key: "hlk_..."
  priority: 5
  cleanup_delay: 15m
  stale_timeout: 24h

# Prometheus or VictoriaMetrics - queried directly for metric history
metrics:
  url: "http://prometheus:9090"
  # Optional auth (uncomment if your Prometheus/VM requires it):
  # username: ""
  # password: ""
  # bearer_token: ""

# Optional: Grafana API for auto-extracting PromQL from alert rules.
# Requires an Editor-role service account token.
# When configured, no per-rule annotations are needed.
# grafana:
#   url: "http://grafana:3000"
#   api_token: "glsa_..."
#   alert_check_interval: 5m  # Poll Grafana to detect resolved alerts when webhooks are missed

# Timeline sparkline defaults
timeline:
  history_window: 30m    # How far back to query on alert fire
  poll_interval: 30s     # How often to poll for fresh data points
  smoothing: true        # Curve smoothing on sparkline
  scale: "linear"        # "linear" or "logarithmic"
  decimals: 1            # Value precision
  severity_label: "severity"
  default_severity: "warning"

# --- Per-rule configuration via Grafana alert rule annotations ---
#
# Instead of configuring rules here, add annotations to your
# Grafana alert rules:
#
#   pushward_query:     The PromQL expression for history backfill
#   pushward_unit:      Unit label (e.g., "%", "°C", "ms")
#   pushward_threshold: Threshold value shown as dashed line
#   pushward_ref_id:    Which values{} key to use (default: first)
#
# If grafana.url + grafana.api_token are set, the query is
# auto-extracted from the alert rule - no annotations needed.

# --- Widgets ---
#
# Each entry below polls a PromQL/MetricsQL query and publishes the value
# to the pushward-server widget API so users see it live on their iOS
# Home Screen / Lock Screen widget. Widgets are auto-created on startup
# (idempotent), and only PATCHed when the value changes (unless
# update_mode: always is set).
#
# Requirements:
#   - The PushWard API key above (pushward.api_key) must be an
#     integration key (hlk_...) with the `widgets` scope enabled.
#     Without it the server returns 403 on first widget create.
#   - Per-user widget cap on the server is 50.
#
# widgets:
#   # Scalar example: number of registered users.
#   - slug: "registered-users"
#     name: "Registered Users"
#     template: "value"           # value|progress|status|gauge|stat_list|trend|countdown
#     query: "pushward_users_total"
#     interval: 60s               # default 60s; min 5s
#     update_mode: "on_change"    # on_change (default) or always
#     min_change: 0               # change tolerance; 0 = any change pushes
#     label_template: "{{.Value}} users"
#     content:
#       icon: "person.3.fill"
#       unit: "users"
#       severity: "info"
#
#   # Gauge example: CPU utilisation 0-100.
#   - slug: "node-cpu"
#     name: "Node CPU"
#     template: "gauge"
#     query: 'avg(100 - rate(node_cpu_seconds_total{mode="idle"}[1m]) * 100)'
#     interval: 30s
#     min_change: 0.5             # only push when utilisation moves > 0.5%
#     label_template: "{{printf \"%.1f\" .Value}}%"
#     content:
#       icon: "cpu"
#       unit: "%"
#       min_value: 0
#       max_value: 100
#       severity: "warning"
#
#   # Multi-series fan-out: one widget per instance label.
#   - slug: "node-mem-base"
#     query_all: 'node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes'
#     slug_template: "node-mem-{{.instance}}"
#     name_template: "Memory free on {{.instance}}"
#     template: "progress"
#     interval: 60s
#     max_series: 20              # safety cap on series cardinality
#     cleanup_missing: false      # set true to DELETE widgets when a series goes away
#     content:
#       icon: "memorychip"
#       min_value: 0
#       max_value: 1
#       severity: "info"
#
#   # stat_list: 1-4 rows of pre-formatted values, polled independently.
#   # Server caps: 4 rows, label <=32 chars, value <=32 chars, unit <=16 chars.
#   # Per row, `trigger` (default true) controls whether that row's value
#   # change can PATCH the widget. Set trigger:false to display a volatile row
#   # without letting it drive updates - the card then only refreshes when a
#   # trigger row changes, at which point every row re-renders with current
#   # values. Under update_mode:on_change at least one row must stay a trigger.
#   - slug: "homelab-stats"
#     name: "Homelab"
#     template: "stat_list"
#     interval: 60s
#     content:
#       icon: "house.fill"
#       severity: "info"
#     stat_rows:
#       - label: "Users"
#         query: "pushward_users_total"
#         value_template: "{{printf \"%.0f\" .Value}}"
#       - label: "MRR"
#         query: "billing_mrr_usd"
#         value_template: "{{printf \"$%.0f\" .Value}}"
#         unit: "USD"
#       - label: "Online"
#         query: "active_devices_5m"
#         value_template: "{{printf \"%.0f\" .Value}}"
#         missing_value: "?"
#         trigger: false             # displays but never triggers a PATCH
#
#   # trend: a sparkline from this bridge's own rolling buffer of the last 48
#   # polls, so it needs no range query and appears after the second poll.
#   # query_all fan-out is not supported - there is one buffer per widget.
#   - slug: "api-latency"
#     name: "API latency"
#     template: "trend"
#     query: 'histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))'
#     interval: 60s
#     stale_after: 3600           # 60-604800s; iOS dims the widget after this
#     content:
#       icon: "waveform.path.ecg"
#       unit: "s"
#       trend: "flat"             # optional arrow: up|down|flat
#
#   # countdown: no query at all. The phone counts down from its own dates, so
#   # the widget is published once and stale_after is rejected.
#   - slug: "cert-expiry"
#     name: "Certificate expiry"
#     template: "countdown"
#     content:
#       end_date: "2026-12-24T18:00:00Z"   # RFC 3339, required
#       expired_text: "Expired"            # replaces the counter once it passes
#       icon: "lock.shield"
#
# stale_after arms a heartbeat that re-sends the stored content every
# max(30s, stale_after/2). The server records an unchanged re-send as a touch
# rather than a push, so a metric that sits flat for hours costs no
# notifications and the widget still looks alive. It must be at least three
# times the poll interval: the heartbeat rides the poll ticker, so a shorter
# window dims the widget between two healthy polls.
#
# Any widget can carry tap targets. tap_action retargets the whole widget;
# url_action and secondary_url_action draw buttons, which iOS renders on the
# Home Screen families only (the Lock Screen, StandBy and Apple Watch families
# have no room for them and use the tap action instead).
#
#     content:
#       tap_action:
#         url: "https://grafana.example.com/d/abc123"
#         foreground: true
#       url_action:
#         url: "https://grafana.example.com/d/abc123"
#         foreground: true
#         title: "Dashboard"
#         icon: "chart.xyaxis.line"
#
# battery, schedule and flow are server widget templates this bridge does not
# offer: each needs several independent readings in a single push, and the
# poller runs one query per widget. Create those through the API or the iOS app.
