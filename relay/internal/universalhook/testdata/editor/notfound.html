<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Link not found</title>
<style>:root {
  color-scheme: light dark;
  --bg: #f2f2f7;
  --card: #ffffff;
  --fg: #1c1c1e;
  --muted: #6c6c70;
  --line: #d1d1d6;
  --accent: #0a60c8;
  --ok: #1e7a34;
  --warn: #8a5800;
  --err: #c4231c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1c1c1e;
    --fg: #f2f2f7;
    --muted: #a1a1a6;
    --line: #3a3a3c;
    --accent: #4c9dff;
    --ok: #4cd964;
    --warn: #ffcc00;
    --err: #ff6961;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
main { max-width: 42rem; margin: 0 auto; padding: 16px; }
h1 { font-size: 28px; margin: 8px 0 4px; }
h2 { font-size: 20px; margin: 24px 0 8px; }
p { margin: 8px 0; }
a { color: var(--accent); }
code, .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; overflow-wrap: anywhere; }
small { display: block; color: var(--muted); font-size: 15px; }
.muted { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); }
.badge { padding: 2px 10px; border: 1px solid currentColor; border-radius: 999px; font-size: 15px; font-weight: 600; }
.pending { color: var(--warn); }
.confirmed { color: var(--ok); }
.rejected { color: var(--muted); }
.banner { margin: 12px 0; padding: 12px 14px; border-left: 4px solid var(--ok); border-radius: 12px; background: var(--card); }
.banner.err { border-left-color: var(--err); }
.banner ul { margin: 4px 0 0; padding-left: 20px; }
fieldset, details { margin: 16px 0; padding: 12px 14px; border: 0; border-radius: 12px; background: var(--card); }
legend { float: left; width: 100%; padding: 0; font-weight: 600; }
legend + * { clear: both; }
label { display: block; margin: 14px 0 4px; font-weight: 600; }
label:first-child { margin-top: 0; }
select, input[type=text], button {
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  color: var(--fg);
  font: inherit;
  font-size: 17px;
}
button { border: 0; background: var(--accent); color: #ffffff; font-weight: 600; }
button.secondary { border: 1px solid var(--line); background: transparent; color: var(--err); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 15px; color: var(--muted); font-weight: 600; }
td select, td input[type=text] { min-width: 7rem; }
summary { min-height: 32px; font-weight: 600; cursor: pointer; }
.actions { display: grid; gap: 10px; margin: 16px 0 24px; }
form:has(#p-progress option[value=""]:checked) .scale,
form:has(#p-severity option[value=""]:checked) .sv,
form:has(#p-lifecycle option[value=""]:checked) .lv { display: none; }
ul.rows { margin: 0; padding: 0; list-style: none; }
ul.rows li { margin: 8px 0; border-radius: 12px; background: var(--card); }
ul.rows a { display: block; padding: 12px 14px; color: inherit; text-decoration: none; }
ul.rows .src { font-weight: 600; }
</style>
</head>
<body>
<main>
<h1>Link not found</h1>
<p>This link is not valid. Open the mapping from the Edit button on its notification, or from the mapping list.</p>
</main>
</body>
</html>
